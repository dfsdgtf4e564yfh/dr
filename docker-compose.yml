version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - ALLOWED_HOSTS=tt134.runflare.run,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://tt134.runflare.run,https://tt134.runflare.run,http://localhost:8000,http://127.0.0.1:8000
      - CSRF_TRUSTED_ORIGINS=http://tt134.runflare.run,https://tt134.runflare.run,http://localhost:8000,http://127.0.0.1:8000
      - DEBUG=False
    volumes:
      - ./backend/data/db.sqlite3:/app/data/db.sqlite3
      - ./backend/media:/app/media
      - ./backend/backups:/app/backups
